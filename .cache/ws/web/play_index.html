      // A phone or tablet with no mouse can't play (pointer lock, keyboard): watch a live match instead
      // (game.html?watch, the spectator view, with "Open this on a laptop to play"). ?play forces the game, ?phone the view.
      ;(function () {
        var q = location.search, touchOnly = !matchMedia("(any-pointer: fine)").matches && (navigator.maxTouchPoints > 0 || "ontouchstart" in window)
        if (/[?&]play(=|&|$)/.test(q) || !(touchOnly || /[?&]phone(=|&|$)/.test(q))) return
        var room = /(?:^#|[#&])room-(\d{1,3})(?:$|&)/.exec(location.hash)
        var code = /(?:^#|[#&])code-([A-Za-z]{4,8})(?:$|&)/.exec(location.hash)
        location.replace("/game.html?watch&kiosk&laptop" + (code ? "&code=" + code[1].toUpperCase() : room ? "&room=" + room[1] : ""))
      })()
    </script>
