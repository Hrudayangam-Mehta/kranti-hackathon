[package]
name = "sessions"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "MIT"
publish = false

[dependencies]
libc = "=0.2.191"
parquet = { version = "=60.1.0", default-features = false }
rayon = "=1.12.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
strip = true
